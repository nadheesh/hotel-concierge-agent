openapi: 3.0.3
info:
  title: hotel-concierge-agent
  version: "1.0.0"
  description: Conversational hotel concierge agent (LangChain/LangGraph).
paths:
  /chat:
    post:
      summary: Send a guest message and get the agent's reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, session_id]
              properties:
                message:
                  type: string
                session_id:
                  type: string
                context:
                  type: object
                  nullable: true
                  additionalProperties: true
      responses:
        "200":
          description: Agent reply
          content:
            application/json:
              schema:
                type: object
                required: [response]
                properties:
                  response:
                    type: string
  /health:
    get:
      summary: Readiness and liveness probe
      responses:
        "200":
          description: Startup state, model, MCP wiring and outbound auth mode
