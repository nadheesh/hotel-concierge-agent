# Choreo component descriptor for the hotel concierge agent.
#
# Port 8000 is the repo-wide convention: main.py's fallback, agent/README.md,
# docs/facilitator-guide.md, scripts/dev_up.sh and the web client all assume it.
# If the platform injects a different PORT, main.py will follow it and the
# declared port below stops matching — keep the two in sync.
schemaVersion: 1.2

endpoints:
  - name: chat
    displayName: Hotel Concierge Agent
    service:
      basePath: /
      port: 8000
    type: REST
    schemaFilePath: openapi.yaml
    networkVisibilities:
      - Public
