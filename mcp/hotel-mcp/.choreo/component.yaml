# Choreo component descriptor for hotel-mcp.
#
# NO schemaFilePath ON PURPOSE. It is optional, and omitting it gives the
# endpoint a wildcard route so the gateway forwards every path and method to
# the app. Pointing it at an OpenAPI file turns that file into a routing
# allowlist: anything not declared there is rejected by the gateway with its
# own 404 and never reaches the server. That broke /admin/reset, /admin/audit,
# and the GET and DELETE halves of the MCP streamable-http transport, since a
# hand-written stub only listed POST /mcp and GET /health.
#
# MCP is JSON-RPC over a streamable-http session, not REST, so there is no
# OpenAPI document that faithfully describes it. Wildcard is the honest
# configuration. openapi.yaml is kept in the repo, unreferenced, for anyone who
# later needs a schema in the console.
#
# VISIBILITY IS PUBLIC AND API SECURITY IS OFF. This server authenticates
# nobody and authorises nothing (see the module docstring in server.py), so
# POST /mcp is an unauthenticated write path to guest booking data for anyone
# holding the URL: create_booking, modify_booking and cancel_booking all run
# for any caller, and list_my_bookings takes the guest as an argument. The
# /admin routes are the exception — _admin_ok fails closed when
# HOTEL_MCP_ADMIN_TOKEN is unset. Acceptable only for a short-lived workshop
# fixture; put the Agent Manager MCP Proxy in front before this is anything more.
#
# basePath stays "/" because the app mounts its own paths at the root:
# streamable-http at /mcp, plus /health and the facilitator /admin routes.
# Consumers therefore use <endpoint-url>/mcp as HOTEL_MCP_URL.
schemaVersion: 1.2

endpoints:
  - name: hotel-mcp
    displayName: Hotel MCP (streamable-http)
    service:
      basePath: /
      # 8080, not 9000. Choreo injects PORT=8080 into the container at runtime,
      # runtime env overrides the image ENV, and server.py honours PORT — so the
      # app listens on 8080 no matter what the Dockerfile says. Declaring 9000
      # here pointed the gateway at a port with no listener: every request hung
      # until the client gave up, and the gateway logged ServiceHost="-".
      port: 8080
    # Allowed types are REST, GraphQL, WS, GRPC, TCP and UDP — no plain HTTP.
    type: REST
    networkVisibilities:
      - Public
