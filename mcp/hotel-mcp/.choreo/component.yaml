# Choreo component descriptor for hotel-mcp.
#
# VISIBILITY IS PUBLIC, AND THAT IS A DELIBERATE, LOAD-BEARING CHOICE.
#
# This server authenticates nobody and authorises nothing (see the module
# docstring in server.py). Every tool runs for any caller that reaches the
# endpoint, including the write tools — create_booking, modify_booking and
# cancel_booking — and list_my_bookings takes the guest as an argument, so a
# caller simply asserts who it is.
#
# Public therefore means the only thing standing in front of guest booking data
# is whatever the Choreo managed API layer enforces (API key / OAuth2) plus the
# Agent Manager MCP Proxy, which is where the read/write split in scopes.py is
# meant to be applied. If API security is ever set to none on this component at
# the same time as Public visibility, this becomes an open, unauthenticated
# write endpoint on the internet. Do not let both be true at once.
#
# basePath stays "/" because the app mounts its own paths at the root:
# streamable-http at /mcp, plus /health and the facilitator /admin routes.
# Consumers therefore use <endpoint-url>/mcp as HOTEL_MCP_URL.
schemaVersion: 1.2

endpoints:
  - name: hotel-mcp
    displayName: Hotel MCP (streamable-http)
    service:
      basePath: /
      port: 9000
    # Allowed types are REST, GraphQL, WS, GRPC, TCP and UDP — there is no
    # plain HTTP option. MCP is JSON-RPC over a streamable-http session rather
    # than REST, so openapi.yaml exists only because REST endpoints are
    # required to carry a schema. It is not a description of the tool surface.
    type: REST
    schemaFilePath: openapi.yaml
    networkVisibilities:
      - Public
