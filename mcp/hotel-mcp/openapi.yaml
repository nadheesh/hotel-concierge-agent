# NOT REFERENCED by .choreo/component.yaml — the endpoint deliberately omits
# schemaFilePath so the gateway uses a wildcard route. Kept only as a fallback
# for a Choreo version or wizard that forces a schema path.
#
# If you do point schemaFilePath at this file, understand what that does: the
# gateway will route ONLY the method and path pairs declared below, answering
# everything else with its own 404 before the request reaches the server. Every
# route the app serves must therefore be listed here, including all three MCP
# transport methods — a stub listing only POST /mcp breaks session streaming
# and teardown.
#
# MCP is JSON-RPC over a streamable-http session, not REST, so this is not a
# faithful description of the tool surface. Real discovery is MCP's tools/list.
openapi: 3.0.3
info:
  title: hotel-mcp
  version: "1.0.0"
  description: >-
    MCP server (streamable-http). Tool discovery and invocation happen over
    JSON-RPC at /mcp; see scopes.py for the read/write tool split that the
    gateway in front of this server is expected to enforce.
paths:
  /mcp:
    post:
      summary: MCP JSON-RPC request (client to server)
      responses:
        "200":
          description: JSON-RPC response, or an SSE stream
    get:
      summary: Server-initiated SSE stream for an established session
      responses:
        "200":
          description: text/event-stream
    delete:
      summary: Terminate an MCP session
      responses:
        "204":
          description: Session terminated
  /health:
    get:
      summary: Readiness and liveness probe
      responses:
        "200":
          description: Seeded booking count and the read/write tool split
  /admin/reset:
    post:
      summary: Facilitator-only — restore the seeded booking state
      description: Requires the x-admin-token header; 403 when HOTEL_MCP_ADMIN_TOKEN is unset.
      responses:
        "200":
          description: State reset
        "403":
          description: Missing or wrong admin token
  /admin/audit:
    get:
      summary: Facilitator-only — which write tools ran
      description: Requires the x-admin-token header; 403 when HOTEL_MCP_ADMIN_TOKEN is unset.
      responses:
        "200":
          description: Audit log entries
        "403":
          description: Missing or wrong admin token
